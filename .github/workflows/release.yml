name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*Setup*.exe
            release/*.blockmap
            release/latest.yml
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/PiP-Browser-Setup-$version-x64.exe"
          $files = @($installer, "$installer.blockmap", "release/latest.yml")
          foreach ($file in $files) { if (!(Test-Path -LiteralPath $file)) { throw "Missing release file: $file" } }
          gh release create $env:GITHUB_REF_NAME @files --draft --verify-tag --title "PiP Browser $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

